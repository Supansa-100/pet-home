services:
  # ─── Frontend: React + Vite ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app                # bind mount source code
      - frontend_node_modules:/app/node_modules  # anonymous volume ป้องกัน host overwrite
    environment:
      - VITE_API_URL=http://localhost:5001
    networks:
      - pethome-network
    depends_on:
      - backend

  # ─── Backend: Node.js + Express ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app                 # bind mount source code
      - backend_node_modules:/app/node_modules  # anonymous volume
      - ./backend/uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    networks:
      - pethome-network
    depends_on:
      db:
        condition: service_healthy    # รอ MySQL พร้อมก่อน

  # ─── Database: MySQL 8 ────────────────────────────────────────────────────
  db:
    image: mysql:8
    ports:
      - "3308:3306"                   # host 3308 → container 3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-pethome_db}
      MYSQL_USER: ${DB_USER:-pethome_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pethomepass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d  # รัน SQL init scripts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pethome-network

  # ─── phpMyAdmin ───────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin
    # platform: linux/amd64   # เปิด comment นี้หากใช้ Apple Silicon (M1/M2/M3/M4)
    ports:
      - "8081:80"             # host 8081 → container 80
    environment:
      PMA_HOST: db            # ติดต่อ MySQL ผ่าน service name 'db'
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    networks:
      - pethome-network
    depends_on:
      db:
        condition: service_healthy

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  pethome-network:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  frontend_node_modules:
  backend_node_modules:
