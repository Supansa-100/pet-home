services:
  db:
    image: mysql:8
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-your_root_password_here}
      MYSQL_DATABASE: pethome_db
      MYSQL_USER: ${DB_USER:-pethome_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_password_here}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-your_root_password_here}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pethome-network

  phpmyadmin:
    image: phpmyadmin:5.2.1
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-your_root_password_here}
    networks:
      - pethome-network
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - PORT=5001
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5173
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=pethome_db
      - DB_USER=${DB_USER:-pethome_user}
      - DB_PASSWORD=${DB_PASSWORD:-your_password_here}
      - DB_SSL=false
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here_change_this_in_production}
      - JWT_EXPIRES_IN=7d
    networks:
      - pethome-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # ให้ vite proxy ส่ง /api ไปที่ service backend ภายใน network เดียวกัน
      - VITE_PROXY_TARGET=http://backend:5001
    networks:
      - pethome-network
    depends_on:
      - backend

networks:
  pethome-network:
    driver: bridge

volumes:
  mysql_data:
  backend_node_modules:
  frontend_node_modules:
