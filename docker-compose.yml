version: '3.8'

services:
  db:
    image: mysql:8.0.32
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-your_root_password_here}
      MYSQL_DATABASE: pethome_db
      MYSQL_USER: ${DB_USER:-pethome_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_password_here}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-your_root_password_here}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pethome-network

  phpmyadmin:
    image: phpmyadmin:5.2.1
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-your_root_password_here}
    networks:
      - pethome-network
    depends_on:
      db:
        condition: service_healthy

networks:
  pethome-network:
    driver: bridge

volumes:
  mysql_data:
